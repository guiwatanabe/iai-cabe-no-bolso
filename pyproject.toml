[project]
name = "iai-cabe-no-bolso"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "google-adk[bigquery-analytics]>=2.10.0",
    "google-cloud-aiplatform[adk,agent-engines]>=2.2.0",
    "google-cloud-bigquery>=3.45.2",
    "mcp>=2.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
proxy = [
    "fastapi>=0.141.1",
    "google-cloud-aiplatform>=2.2.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "agents"]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "proxy"]

[tool.ruff]
line-length = 120
src = [".", "agents"]
# pastas vindas de cabe-no-bolso-hml: agent/ tem pyproject, testes e job de CI próprios
extend-exclude = ["agent", "analise", "camada_analitica", "deploy", "docs/arquivo", "scripts/download_bigquery.py"]
