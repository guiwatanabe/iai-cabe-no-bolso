# GenAI FinOps do Cabe no Bolso. Única fonte de preços e limites de custo. Cada preço tem fonte e data.
# Quem lê: agent/cabe_core/finops.py (funções puras: preço, custo em USD, projeção, travas). Daí saem o painel da banca
# (GET /api/painel/{sessao}.finops), o log JSON por turno (server/finops.py -> Cloud Logging), o custo por caso dos evals
# (agent/evals/rodar.py) e os mocks da demo (analise/gera_mock_demo.py).
# Sem preço confirmado (status != confirmada), o custo daquele modelo fica null e o painel diz "preço a conferir"; nunca se inventa preço.
# Preços em USD; conversão para BRL só com câmbio com fonte (não há; o painel mostra USD).

precos:
  gemini-3.8-flash:
    entrada_por_milhao_usd: 0.75
    saida_por_milhao_usd: 3.75
    entrada_cacheada_por_milhao_usd: 0.075
    vigencia: "introdutório até 31/12/2026; a partir de 01/01/2027: 1.50 / 7.50"
    fonte: "https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing (endpoint global; consultado em 27/09/2026 02h)"
    status: confirmada
  gemini-2.5-flash:
    entrada_por_milhao_usd: 0.30
    saida_por_milhao_usd: 2.50
    entrada_cacheada_por_milhao_usd: 0.03
    vigencia: "preço padrão (sem data de mudança anunciada na página em 27/09/2026)"
    fonte: "https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing (linha 'Gemini 2.5 Flash · Input (text, image, video) $0.30 · Text output (response and reasoning) $2.50'; consultado em 27/09/2026 02h)"
    status: confirmada
  cloud_run:
    vcpu_segundo_ativo_usd: 0.000024
    gib_segundo_ativo_usd: 0.0000025
    vcpu_segundo_ocioso_min_instance_usd: 0.0000025
    gib_segundo_ocioso_min_instance_usd: 0.0000025
    fonte: "https://cloud.google.com/run/pricing (tier 1, us-central1; consultado em 27/09/2026)"
    status: confirmada
  bigquery:
    por_tib_consultado_usd: null
    fonte: "DESCONHECIDO; conferir em https://cloud.google.com/bigquery/pricing"
    status: conferir

# Piloto usado na projeção do painel (só multiplicação: custo da sessão x clientes; rótulo "projeção", nunca medição)
piloto:
  clientes: 384
  fonte: "docs/01-evidencias-base.md §8: grupo B (Rolando, 3-5 faturas roladas em 12 meses) = 384 clientes da base"
  ciclos_por_cliente: 1        # uma conversa por cliente por ciclo de fatura; o acompanhamento mensal não chama o modelo

# Medido ao vivo em 27/09/2026 (agent/evals/resultado-2026-09-27-verificacao.md), modo tools, sem validador
baseline_medido:
  sessao_bruno: {chamadas: 3, tokens_entrada: 15483, tokens_saida: 352, latencia_p50_ms: 2673, latencia_p95_ms: 3990}
  sessao_ana: {chamadas: 3, tokens_entrada: 14618, tokens_saida: 248, latencia_p50_ms: 2715, latencia_p95_ms: 3356}
  golden_set: {chamadas: 19, tokens_entrada: 90432, tokens_saida: 1978, latencia_p50_ms: 3420, latencia_p95_ms: 5607}
  # custo da sessão do Bruno = 15483/1e6*0.75 + 352/1e6*3.75 = US$ 0,0129
  # modo gi com validador (verificação pela API, 27/09 02h): Ana ver_opcoes 6,8 s de parede (agente 4,1 s + validador 2,5 s),
  # confirmar_entrada_regular 8,2 s; Bruno ver_opcoes 16,6 s com 1 regeneração. Alavancas de latência: MODELO_VALIDADOR e
  # VALIDADOR_ATIVO (deploy/deploy.sh, agent/.env.example).

# Travas de custo (onde cada uma vive)
travas:
  chamadas_llm_por_turno_max: 3          # agente + validador + 1 regeneração (cabe_no_bolso/runtime.py)
  chamadas_llm_por_sessao_max: 12        # servidor devolve mensagem segura acima disso (server/conversa.py: teto_chamadas_por_sessao, _resposta_teto)
  tool_calls_por_turno_max: 8            # before_tool (cabe_no_bolso/callbacks.py: teto por invocação, padrão trazido de guiwatanabe/iai-cabe-no-bolso)
  thinking: minimo                       # generate_content_config (PENSAMENTO=budget:0)
  acompanhamento_com_llm: false          # cabe_core.acompanhar; docs/05 §14
  insight_por_sessao_max: 1              # card do cartão
  mensagens_proativas_por_dia_max: 1     # spec da Gi
  cloud_run: {min_instances_demo: 1, min_instances_fora_da_demo: 0, max_instances: 1, concurrency: 40, cpu: 1, memoria_gib: 1}
  rate_limit_por_minuto_por_ip: 120
  bigquery_maximum_bytes_billed: 1000000000   # 1 GB por consulta; uma consulta por cliente por sessão
  orcamento_grupo_usd: 1000
  alertas_orcamento_pct: [50, 80, 100]         # deploy/orcamento.sh (Cloud Billing budgets; exige papel de billing)

# Observabilidade: um registro JSON por papel por turno no stdout (Cloud Logging, jsonPayload), sem PII nem extrato.
# Campos: evento=turno, sessao_id, ordem, papel (agente|validador|codigo), modelo, chamadas, tokens_entrada, tokens_saida,
# latencia_ms, custo_usd, validador_aprovado, regeneracoes, mensagem_segura, modo, gatilho, acao. Métricas: deploy/metricas.sh.
logs:
  evento_turno: turno
  metricas: {custo: cabe_custo_usd, latencia: cabe_latencia_ms, mensagens_seguras: cabe_mensagens_seguras, tokens: cabe_tokens}
